version: 2

models:
  - name: stg_apec__offres
    description: >
      Offres APEC (cadres) nettoyees et normalisees.
      Dedoublonnage sur offre_id (derniere date_publication / date_insertion).
      Salaire structure en STRUCT via UDF parse_salaire_auto.
      Materialisee en TABLE pour eviter le re-scan des external tables BQ.
    config:
      materialized: table
    columns:
      - name: offre_id
        data_type: STRING
        description: "Identifiant unique de l offre (champ apec_id source)"
        tests:
          - not_null
          - unique

      - name: intitule
        data_type: STRING
        description: "Titre du poste normalise UPPER sans accents, indicateurs H/F supprimes"

      - name: description
        data_type: STRING
        description: "Apercu du descriptif de poste, HTML supprime et texte normalise"

      - name: nom
        data_type: STRING
        description: "Nom commercial de l entreprise normalise"

      - name: salaire
        data_type: "STRUCT<type STRING, min_amount NUMERIC, max_amount NUMERIC, nb_mois INT64, min_mensuel NUMERIC, max_mensuel NUMERIC, min_annuel NUMERIC, max_annuel NUMERIC>"
        description: "Salaire parse par l UDF parse_salaire_auto (format APEC: 35/55 k annuel sur 13 mois)"

      - name: code_contrat
        data_type: STRING
        description: "Type de contrat decode par l ingestion (CDI, CDD, Stage, Interim, Alternance) normalise"

      - name: commune
        data_type: STRING
        description: "Nom de la commune extrait du champ lieuTexte par l ingestion, normalise"

      - name: departement
        data_type: STRING
        description: "Code departement extrait du champ lieuTexte (2-3 chars), mis en majuscules"

      - name: lieu_texte
        data_type: STRING
        description: "Texte brut du lieu normalise (ex: PARIS 75)"

      - name: latitude
        data_type: FLOAT64
        description: "Latitude WGS84 fournie par l API APEC"

      - name: longitude
        data_type: FLOAT64
        description: "Longitude WGS84 fournie par l API APEC"

      - name: date_publication
        data_type: TIMESTAMP
        description: "Date et heure de publication de l offre (UTC)"

      - name: date_validation
        data_type: TIMESTAMP
        description: "Date et heure de validation de l offre (UTC)"

      - name: scraped_at
        data_type: TIMESTAMP
        description: "Timestamp de collecte de l offre (UTC)"

      - name: date_insertion
        data_type: DATE
        description: "Date d insertion derivee de la partition Hive dt"
