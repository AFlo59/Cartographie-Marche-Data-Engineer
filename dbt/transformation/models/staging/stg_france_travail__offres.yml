version: 2

models:
  - name: stg_france_travail__offres
    description: >
      Offres France Travail nettoyées et normalisées. Dédoublonnage sur offre_id.
      Salaire et contrat structurés en STRUCT via UDFs BigQuery.
      Enrichi des champs calculés : relevance_score, contract_type_normalized, salary_min/max_annual.
    config:
      materialized: table
    columns:
      - name: offre_id
        data_type: STRING
        description: "Identifiant unique de l'offre (champ id source)"
        tests:
          - not_null
          - unique
      - name: intitule
        data_type: STRING
        description: "Titre du poste normalisé UPPER sans accents, indicateurs H/F supprimés"
      - name: description
        data_type: STRING
        description: "Description du poste, HTML supprimé et texte normalisé"
      - name: date_creation
        data_type: TIMESTAMP
        description: "Date de création de l'offre (ISO 8601 parsé par parse_event_ts)"
      - name: code_postal
        data_type: STRING
        description: "Code postal normalisé 5 chiffres (préfixe 0 ajouté pour DOM-TOM 4 chiffres)"
      - name: code_insee
        data_type: STRING
        description: "Code INSEE de la commune du lieu de travail (5 chars)"
      - name: departement
        data_type: STRING
        description: "Code département déduit du code postal (2 chars) ou libellé (2A/2B/97x)"
      - name: nom_commune
        data_type: STRING
        description: "Nom de la commune extrait du libellé lieuTravail après suppression du code dept"
      - name: nom
        data_type: STRING
        description: "Nom de l'entreprise recruteur normalisé (peut être NULL)"
      - name: siret
        data_type: STRING
        description: "SIRET de l'entreprise validé 14 chiffres ou NULL si invalide"
      - name: salaire_texte_raw
        data_type: STRING
        description: "Texte brut du salaire conservé pour affichage (avant parsing)"
      - name: salaire
        data_type: "STRUCT<type STRING, min_amount NUMERIC, max_amount NUMERIC, nb_mois INT64, min_mensuel NUMERIC, max_mensuel NUMERIC, min_annuel NUMERIC, max_annuel NUMERIC>"
        description: "Salaire parsé par l'UDF parse_salaire_auto"
      - name: salary_min_annual
        data_type: NUMERIC
        description: "Salaire annuel minimum en euros (aplati depuis salaire.min_annuel)"
      - name: salary_max_annual
        data_type: NUMERIC
        description: "Salaire annuel maximum en euros (aplati depuis salaire.max_annuel)"
      - name: bonus
        data_type: STRING
        description: "Complément salaire (primes, avantages) normalisé"
      - name: code_contrat
        data_type: STRING
        description: "Code type de contrat brut France Travail (CDI, CDD, MIS, SAI, etc.)"
      - name: contrat
        data_type: "STRUCT<type_contrat STRING, duree_mois NUMERIC, type_duree STRING>"
        description: "Type de contrat parsé par l'UDF parse_contrat"
      - name: contract_type_normalized
        data_type: STRING
        description: "Type de contrat normalisé inter-sources : CDI | CDD | INTERIM | ALTERNANCE | STAGE | FREELANCE | AUTRE"
      - name: code_rome
        data_type: STRING
        description: "Code ROME du métier (5 chars, ex: M1811)"
      - name: appellation
        data_type: STRING
        description: "Libellé ROME de l'appellation du poste normalisé"
      - name: experience
        data_type: STRING
        description: "Niveau expérience normalisé (D débutant, S confirmé, E expert)"
      - name: qualification
        data_type: STRING
        description: "Code qualification du poste normalisé"
      - name: relevance_score
        data_type: INT64
        description: "Score de pertinence Data Engineering (>= 15 = fort, < 0 = hors cible)"
      - name: matching_confidence
        data_type: STRING
        description: "Confiance pertinence : HIGH | MEDIUM | LOW | NOT_RELEVANT"
      - name: date_insertion
        data_type: DATE
        description: "Date d'insertion dérivée de la partition Hive dt"
