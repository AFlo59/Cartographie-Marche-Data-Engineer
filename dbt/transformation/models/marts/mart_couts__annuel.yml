version: 2

models:
  - name: mart_couts__annuel
    description: >
      Vue BI — coûts GCP annuels par service, SKU, région et type de coût.
      Agrégation annuelle de l'export standard gcp_billing_export_v1 (sans granularité ressource).
      Inclut coût brut, crédits appliqués et coût net final.
      Pour le détail par ressource, utiliser mart_couts_ressource__annuel.
    config:
      materialized: view
    columns:
      - name: projet_id
        description: "ID du projet GCP"
        tests:
          - not_null
      - name: service
        description: "Nom du service GCP facturé (ex: Cloud Run, BigQuery, Cloud Storage, Artifact Registry)"
        tests:
          - not_null
      - name: sku
        description: "Libellé détaillé du SKU facturé"
      - name: region
        description: "Région GCP de la ressource. Null pour les ressources globales."
      - name: pays
        description: "Pays de la ressource."
      - name: type_cout
        description: "Type de ligne de coût : regular, tax, adjustment, rounding_error."
        tests:
          - not_null
          - accepted_values:
              values: ['regular', 'tax', 'adjustment', 'rounding_error']
      - name: annee
        description: "Année de facturation (ex: 2026)."
        tests:
          - not_null
      - name: cout_brut_eur
        description: "Coût brut en EUR avant application des crédits."
        tests:
          - not_null
      - name: credits_eur
        description: "Total des crédits appliqués en EUR (valeur négative = réduction de coût)."
        tests:
          - not_null
      - name: cout_net_eur
        description: "Coût net final en EUR après crédits — montant réellement facturé."
        tests:
          - not_null
