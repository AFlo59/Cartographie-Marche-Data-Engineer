version: 2

models:
  - name: mart_couts_ressource__mensuel
    description: >
      Vue BI — coûts GCP mensuels par ressource spécifique (Cloud Run Job, dataset BigQuery, bucket GCS…).
      Basée sur l'export resource-level qui attribue les coûts à des ressources précises via resource.global_name.
      Plus granulaire que mart_couts__mensuel : permet de voir le coût exact de chaque job Cloud Run.
    config:
      materialized: view
    columns:
      - name: projet_id
        description: "ID du projet GCP"
        tests:
          - not_null
      - name: service
        description: "Nom du service GCP facturé (ex: Cloud Run, BigQuery, Cloud Storage)"
        tests:
          - not_null
      - name: sku
        description: "Libellé détaillé du SKU facturé"
      - name: ressource_nom
        description: "Nom court de la ressource GCP (ex: datatalent-ingestion-job). Null si non applicable."
      - name: ressource_global_nom
        description: "Identifiant global complet de la ressource (ex: //run.googleapis.com/projects/.../jobs/datatalent-dbt-job). Null si non applicable."
      - name: ressource_type
        description: "Type de ressource GCP (ex: cloud_run_job, bigquery_dataset). Null si non applicable."
      - name: region
        description: "Région GCP de la ressource. Null pour les ressources globales."
      - name: pays
        description: "Pays de la ressource (ex: BE, US)."
      - name: type_cout
        description: "Type de ligne de coût : regular, tax, adjustment, rounding_error."
        tests:
          - not_null
          - accepted_values:
              values: ['regular', 'tax', 'adjustment', 'rounding_error']
      - name: mois
        description: "Premier jour du mois de facturation."
        tests:
          - not_null
      - name: annee
        description: "Année de facturation."
        tests:
          - not_null
      - name: trimestre
        description: "Trimestre de facturation (1 à 4)."
      - name: cout_brut_eur
        description: "Coût brut en EUR avant crédits."
        tests:
          - not_null
      - name: credits_eur
        description: "Total des crédits appliqués en EUR (valeur négative = réduction)."
        tests:
          - not_null
      - name: cout_net_eur
        description: "Coût net final en EUR après crédits."
        tests:
          - not_null
