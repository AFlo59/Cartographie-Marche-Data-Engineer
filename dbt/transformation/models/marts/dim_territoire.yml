version: 2

models:
  - name: dim_territoire
    description: >
      Dimension territoire — référentiel géographique France métropolitaine + DOM-TOM.
      1 ligne par (commune × code_postal) : une commune peut avoir plusieurs codes postaux.
      Jointure depuis fct_offres.code_postal → dim_territoire.code_postal
      ou fct_offres.departement → dim_territoire.code_departement.
    config:
      materialized: table
      contract:
        enforced: true
    columns:
      - name: code_postal
        data_type: STRING
        description: "Code postal (5 chiffres)"
        constraints:
          - type: not_null
      - name: code_insee
        data_type: STRING
        description: "Code INSEE de la commune (5 chars)"
      - name: code_departement
        data_type: STRING
        description: "Code département (2-3 chars : 01, 75, 2A, 971)"
      - name: code_region
        data_type: STRING
        description: "Code région INSEE"
      - name: nom_commune
        data_type: STRING
        description: "Nom officiel de la commune normalisé UPPER"
      - name: nom_departement
        data_type: STRING
        description: "Nom du département"
      - name: nom_region
        data_type: STRING
        description: "Nom de la région"
      - name: population
        data_type: INT64
        description: "Population municipale arrondie (source INSEE via API Geo)"
      - name: latitude
        data_type: FLOAT64
        description: "Latitude WGS84 du centroïde de la commune"
      - name: longitude
        data_type: FLOAT64
        description: "Longitude WGS84 du centroïde de la commune"
