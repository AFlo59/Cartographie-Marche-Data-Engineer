version: 2

models:
  - name: int_apec__enrichie
    description: >
      Gold layer APEC : offres enrichies géographie + SIRENE.
      Jointure géo sur commune normalisée + département.
      Jointure SIRENE par nom normalisé uniquement (pas de SIRET APEC).
      Coordonnées source APEC (geocodage ingestion) conservées en priorité.
      Incremental merge sur offre_id, fenêtre -7j.
    config:
      materialized: incremental
      unique_key: offre_id
      incremental_strategy: merge
    columns:
      - name: offre_id
        data_type: STRING
        description: "Identifiant unique de l'offre APEC"
        tests:
          - not_null
          - unique
      - name: source_offre
        data_type: STRING
        description: "Toujours 'apec'"
      - name: intitule
        data_type: STRING
        description: "Titre du poste normalisé"
      - name: description
        data_type: STRING
        description: "Description du poste normalisée"
      - name: date_creation
        data_type: DATE
        description: "Date de publication de l'offre"
      - name: date_insertion
        data_type: DATE
        description: "Date d'insertion (partition Hive)"
      - name: code_postal
        data_type: STRING
        description: "NULL pour APEC (non disponible dans la source)"
      - name: code_insee
        data_type: STRING
        description: "Code INSEE commune (depuis référentiel géo si correspondance trouvée)"
      - name: commune
        data_type: STRING
        description: "Nom commune normalisé (source APEC)"
      - name: departement
        data_type: STRING
        description: "Code département (source APEC ou référentiel)"
      - name: nom_departement
        data_type: STRING
        description: "Nom du département (référentiel)"
      - name: code_region
        data_type: STRING
        description: "Code région INSEE"
      - name: nom_region
        data_type: STRING
        description: "Nom de la région (référentiel)"
      - name: latitude
        data_type: FLOAT64
        description: "Latitude WGS84 source APEC (geocodage ingestion, prioritaire)"
      - name: longitude
        data_type: FLOAT64
        description: "Longitude WGS84 source APEC"
      - name: nom_entreprise_source
        data_type: STRING
        description: "Nom entreprise depuis la source APEC"
      - name: siret
        data_type: STRING
        description: "NULL pour APEC (non disponible dans la source)"
      - name: siret_sirene
        data_type: STRING
        description: "SIRET depuis SIRENE après jointure par nom"
      - name: siren_sirene
        data_type: STRING
        description: "SIREN depuis SIRENE"
      - name: nom_entreprise_sirene
        data_type: STRING
        description: "Nom entreprise depuis SIRENE"
      - name: nom_entreprise_final
        data_type: STRING
        description: "Nom entreprise final : SIRENE si disponible, sinon source"
      - name: code_naf
        data_type: STRING
        description: "Code NAF SIRENE"
      - name: code_categorie_juridique
        data_type: STRING
        description: "Code catégorie juridique SIRENE"
      - name: categorie_entreprise
        data_type: STRING
        description: "Catégorie entreprise INSEE : PME | ETI | GE"
      - name: tranche_effectifs
        data_type: STRING
        description: "Tranche effectifs SIRENE"
      - name: fiabilite_jointure_sirene
        data_type: STRING
        description: "Fiabilité jointure SIRENE : HIGH | MEDIUM | LOW | NO_MATCH"
      - name: code_contrat
        data_type: STRING
        description: "Type de contrat source APEC"
      - name: contract_type_normalized
        data_type: STRING
        description: "Type de contrat normalisé inter-sources"
      - name: type_contrat_libelle
        data_type: STRING
        description: "NULL pour APEC"
      - name: duree_contrat_mois
        data_type: NUMERIC
        description: "NULL pour APEC"
      - name: salaire_texte
        data_type: STRING
        description: "Texte brut du salaire pour affichage"
      - name: salary_min_annual
        data_type: NUMERIC
        description: "Salaire annuel minimum en euros"
      - name: salary_max_annual
        data_type: NUMERIC
        description: "Salaire annuel maximum en euros"
      - name: bonus
        data_type: STRING
        description: "NULL pour APEC"
      - name: code_rome
        data_type: STRING
        description: "NULL pour APEC"
      - name: appellation
        data_type: STRING
        description: "NULL pour APEC"
      - name: experience
        data_type: STRING
        description: "NULL pour APEC"
      - name: qualification
        data_type: STRING
        description: "NULL pour APEC"
      - name: relevance_score
        data_type: INT64
        description: "Score de pertinence Data Engineering"
      - name: matching_confidence
        data_type: STRING
        description: "Confiance pertinence : HIGH | MEDIUM | LOW | NOT_RELEVANT"
      - name: url
        data_type: STRING
        description: "NULL pour APEC"
