name: datatalent_transformation
version: 1.0.0
config-version: 2

profile: datatalent

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Création automatique des UDFs BigQuery avant chaque run.
# Les macros *_udf_ddl() retournent un CREATE OR REPLACE FUNCTION exécuté par dbt.
# En cas d'erreur de droits, créer les UDFs manuellement :
#   dbt run-operation create_parse_event_ts_udf
#   dbt run-operation create_parse_contrat_udf
#   dbt run-operation create_parse_salaire_auto_udf
#   dbt run-operation create_lambert93_udf
on-run-start:
  - "{{ parse_event_ts_udf_ddl() if execute }}"
  - "{{ parse_contrat_udf_ddl() if execute }}"
  - "{{ parse_salaire_auto_udf_ddl() if execute }}"
  - "{{ lambert93_udf_ddl() if execute }}"

models:
  datatalent_transformation:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view    # defaut view, modeles lourds surchargent via config()
      +schema: staging

    intermediate:
      +materialized: incremental    # couche gold, merge sur unique_key
      +schema: staging              # non expose au dashboard-sa (acces marts uniquement)

    marts:
      +materialized: view           # passthrough depuis intermediate gold
      +schema: marts

seeds:
  datatalent_transformation:
    +schema: raw
