name: datatalent_transformation
version: 1.0.0
config-version: 2

profile: datatalent

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Création automatique des UDFs BigQuery avant chaque run.
# Les macros *_udf_ddl() retournent un CREATE OR REPLACE FUNCTION exécuté par dbt.
# En cas d'erreur de droits, créer les UDFs manuellement :
#   dbt run-operation create_parse_event_ts_udf
#   dbt run-operation create_parse_contrat_udf
#   dbt run-operation create_parse_salaire_auto_udf
#   dbt run-operation create_lambert93_udf
on-run-start:
  - "{{ parse_event_ts_udf_ddl() if execute }}"
  - "{{ parse_contrat_udf_ddl() if execute }}"
  - "{{ parse_salaire_auto_udf_ddl() if execute }}"
  - "{{ lambert93_udf_ddl() if execute }}"

models:
  datatalent_transformation:
    +persist_docs:
      relation: true
      columns: true
    +contract:
          enforced: false

    staging:
      +materialized: view    # defaut view, modeles lourds surchargent via config()
      +schema: staging

    intermediate:
      +materialized: incremental    # couche gold, merge sur unique_key
      +schema: intermediate

    marts:
      +materialized: view           # passthrough depuis intermediate gold
      +schema: marts
      # Contract enforced pour les modèles marts :
      # BigQuery valide le schéma à la compilation (types + présence des colonnes).
      # Requiert que TOUTES les colonnes soient typées dans le YAML du modèle.
      # Les modèles sans YAML complet peuvent surcharger avec contract.enforced: false.
      +contract:
        enforced: true
      # Dimensions : TABLE (refresh complet hebdo, données stables)
      dim_date:
        +materialized: table
      dim_territoire:
        +materialized: table
      dim_entreprise:
        +materialized: table
      # Table de faits : TABLE (UNION ALL des 3 sources, cohérence garantie)
      fct_offres:
        +materialized: table
      # Vue BI : contract non enforced (SELECT * depuis fct_offres + colonnes calculées)
      mart_marche_emploi:
        +contract:
          enforced: false

seeds:
  datatalent_transformation:
    +schema: raw
