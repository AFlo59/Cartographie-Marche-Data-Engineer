name: Ingestion CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/ingestion/**"
      - ".github/workflows/ingestion-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-push-ingestion:
    name: Verify ingestion image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ingestion image
        run: |
          docker build \
            -f src/ingestion/Dockerfile \
            -t datatalent-ingestion-ci:latest \
            src/ingestion
