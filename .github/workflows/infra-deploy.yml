name: Infra Deploy — Terraform

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  ingestion-verify:
    name: Verify ingestion image before Terraform
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      AR_REGION: europe-west1
      AR_REPO: datatalent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ingestion image
        run: |
          docker build \
            -f src/ingestion/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:latest \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:${{ github.sha }} \
            src/ingestion

  dbt-verify:
    name: Verify dbt before Terraform
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ci
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION != '' && secrets.GCP_LOCATION || vars.GCP_LOCATION != '' && vars.GCP_LOCATION || 'EU' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auth GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Build dbt image
        run: docker build -f dbt/transformation/Dockerfile -t datatalent-dbt-ci:latest dbt/transformation

      - name: dbt parse
        run: |
          docker run --rm \
            -e DBT_TARGET=${DBT_TARGET} \
            -e GCP_PROJECT_ID=${GCP_PROJECT_ID} \
            -e GCP_LOCATION=${GCP_LOCATION} \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json \
            -v "${GOOGLE_APPLICATION_CREDENTIALS}:/tmp/gcp-creds.json:ro" \
            datatalent-dbt-ci:latest \
            dbt parse --project-dir /app --profiles-dir /app

      - name: dbt compile
        run: |
          docker run --rm \
            -e DBT_TARGET=${DBT_TARGET} \
            -e GCP_PROJECT_ID=${GCP_PROJECT_ID} \
            -e GCP_LOCATION=${GCP_LOCATION} \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json \
            -v "${GOOGLE_APPLICATION_CREDENTIALS}:/tmp/gcp-creds.json:ro" \
            datatalent-dbt-ci:latest \
            dbt compile --project-dir /app --profiles-dir /app

  push-images:
    # Changement : Ce job s'exécute AVANT Terraform pour que l'image existe lors du déploiement
    needs: [ingestion-verify, dbt-verify]
    name: Push ingestion & dbt images to Artifact Registry
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      AR_REGION: europe-west1
      AR_REPO: datatalent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${AR_REGION}-docker.pkg.dev --quiet

      - name: Build and push ingestion image
        run: |
          docker build \
            -f src/ingestion/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:latest \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:${{ github.sha }} \
            src/ingestion
          docker push ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:latest
          docker push ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/ingestion:${{ github.sha }}

      - name: Build and push dbt image
        run: |
          docker build \
            -f dbt/transformation/Dockerfile \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/dbt:latest \
            -t ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/dbt:${{ github.sha }} \
            dbt/transformation
          docker push ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/dbt:latest
          docker push ${AR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/dbt:${{ github.sha }}

  terraform:
    # Changement : Ce job attend maintenant que les images soient poussées
    needs: [ingestion-verify, dbt-verify, push-images]
    if: always() && (needs.ingestion-verify.result == 'success' && needs.dbt-verify.result == 'success')
    name: Terraform ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest

    env:
      TF_BACKEND_BUCKET: datatalent-tfstate-cartographie-data-engineer
      CI_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      TF_VAR_region: europe-west1
      TF_VAR_location: EU
      TF_VAR_environment: dev
      TF_VAR_project_prefix: datatalent
      TF_VAR_bucket_versioning_enabled: "true"
      TF_VAR_bucket_force_destroy: "false"
      TF_VAR_bucket_lifecycle_delete_age_days: "365"
      TF_VAR_bucket_nearline_age_days: "30"
      TF_VAR_bucket_geo_prefix_delete_age_days: "60"
      TF_VAR_bucket_france_travail_prefix_delete_age_days: "60"
      TF_VAR_bucket_sirene_prefix_delete_age_days: "60"
      TF_VAR_raw_dataset_id: raw
      TF_VAR_staging_dataset_id: staging
      TF_VAR_marts_dataset_id: marts
      TF_VAR_ingestion_france_travail_prefix: raw/france_travail/
      TF_VAR_ingestion_sirene_prefix: raw/sirene/
      TF_VAR_ingestion_geo_prefix: raw/geo/
      TF_VAR_ingestion_service_account_email: ingestion-sa@cartographie-data-engineer.iam.gserviceaccount.com
      TF_VAR_dbt_service_account_email: dbt-sa@cartographie-data-engineer.iam.gserviceaccount.com
      TF_VAR_dashboard_service_account_email: dashboard-sa@cartographie-data-engineer.iam.gserviceaccount.com
      TF_VAR_scheduler_job_name_prefix: datatalent-ingestion
      TF_VAR_scheduler_service_account_email: ingestion-sa@cartographie-data-engineer.iam.gserviceaccount.com
      TF_VAR_manage_project_job_user_bindings: "false"
      TF_VAR_create_compute_job: "true"
      TF_VAR_create_external_tables: "true"
      TF_VAR_compute_job_name: datatalent-ingestion-job
      # Changement : Utilisation du SHA pour l'image d'ingestion
      TF_VAR_compute_image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}/datatalent/ingestion:${{ github.sha }}
      TF_VAR_compute_memory: 512Mi
      TF_VAR_compute_cpu: "1"
      TF_VAR_compute_timeout_seconds: "1800"
      TF_VAR_compute_max_retries: "1"
      TF_VAR_secret_ft_client_id_name: FT_CLIENT_ID
      TF_VAR_secret_ft_client_secret_name: FT_CLIENT_SECRET
      TF_VAR_secret_datagouv_api_key_name: DATAGOUV_API_KEY
      TF_VAR_ci_service_account_email: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}
      TF_VAR_create_dbt_job: "true"
      TF_VAR_dbt_job_name: datatalent-dbt-job
      # Changement : Utilisation du SHA pour l'image dbt
      TF_VAR_dbt_compute_image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}/datatalent/dbt:${{ github.sha }}
      TF_VAR_dbt_memory: 1Gi
      TF_VAR_dbt_cpu: "1"
      TF_VAR_dbt_timeout_seconds: "1800"
      TF_VAR_dbt_max_retries: "0"
      TF_VAR_manage_log_retention: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required CI inputs
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=0
          for input_name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT; do
            if [ -z "${!input_name:-}" ]; then
              echo "::error::Missing GitHub Actions secret or variable: ${input_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Auth GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER != '' && secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT != '' && secrets.GCP_WIF_SERVICE_ACCOUNT || vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}

      - name: Ensure Terraform backend bucket exists
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        shell: bash
        run: |
          if ! gcloud storage buckets describe "gs://${TF_BACKEND_BUCKET}" --project="${TF_VAR_project_id}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${TF_BACKEND_BUCKET}" --project="${TF_VAR_project_id}" --location="${TF_VAR_region}" --uniform-bucket-level-access
            gcloud storage buckets update "gs://${TF_BACKEND_BUCKET}" --versioning
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${TF_BACKEND_BUCKET}"

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: infra
        run: terraform plan -no-color

      - name: Terraform Apply
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        working-directory: infra
        run: terraform apply -auto-approve